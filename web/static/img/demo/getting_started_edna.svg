  <text x="80" y="340" font-size="28" font-family="Segoe UI, Arial" fill="#ffffff" opacity="0.95">Getting Started</text>
  <text x="80" y="372" font-size="18" font-family="Segoe UI, Arial" fill="#e8f3f7">Use the tutorial to explore workflows</text>
