<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">Latest eDNA Research</title>
  <desc id="desc">Laboratory flasks and DNA helix representing recent environmental DNA publications.</desc>
  <rect x="0" y="0" width="800" height="450" fill="#e8f3f7"/>
  <g transform="translate(80,120)">
    <path d="M40,0 L80,0 L70,120 C70,140 40,140 40,120 Z" fill="#9fd3c7"/>
    <path d="M120,0 L160,0 L140,140 C140,160 120,160 110,140 Z" fill="#4cc9f0"/>
    <path d="M200,0 L240,0 L220,110 C220,130 200,130 190,110 Z" fill="#1d7ea8"/>
  </g>
  <g transform="translate(420,80)">
    <path d="M0,0 C30,30 30,80 0,110 C-30,140 -30,190 0,220" stroke="#0a4d68" stroke-width="6" fill="none"/>
    <path d="M30,0 C0,30 0,80 30,110 C60,140 60,190 30,220" stroke="#9fd3c7" stroke-width="6" fill="none"/>
    <g fill="#1d7ea8">
      <circle cx="0" cy="30" r="6"/>
      <circle cx="30" cy="80" r="6"/>
      <circle cx="0" cy="130" r="6"/>
      <circle cx="30" cy="180" r="6"/>
    </g>
  </g>
  <text x="80" y="360" font-size="28" font-family="Segoe UI, Arial" fill="#053b50">Latest Research</text>
  <text x="80" y="390" font-size="18" font-family="Segoe UI, Arial" fill="#0a4d68">Explore studies and NOAA resources</text>
</svg>